[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "balneabilidade-sc-mcp"
version = "0.1.0"
description = "Official IMA/SC bathing-water quality provider and MCP server for Santa Catarina, Brazil"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Lucio Bottacin" }]
dependencies = [
    "httpx>=0.27,<1",
    "pypdf>=5.1,<7",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/balneabilidade_sc_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = false
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true
